<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" width="400" height="540" role="img" aria-labelledby="t d">
  <title id="t">Analista de dados com IA — o agente pensa no servidor, o Python roda no seu navegador</title>
  <desc id="d">Uma pergunta é digitada e o agente, no servidor, monta o plano e escreve o SQL. Um pacote com o código e os dados cruza a fronteira e o Python roda no navegador de quem perguntou, num Worker sem rede além do caminho fixo do Pyodide, e calcula a correlação r = -0,506. Por fim aparece o selo “números conferidos”, cerca de 14 segundos e custo zero.</desc>
  <style>
    .f { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; } .m { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }
    .brand { font-size: 21px; font-weight: 700; fill: #E6EDF7; letter-spacing: -.3px; }
    .rule  { font-size: 17px; font-weight: 500; fill: #9FB0C8; }
    .chip  { font-size: 16px; font-weight: 600; fill: #E6EDF7; }
    .num   { font-size: 15px; font-weight: 700; fill: #4C7DFF; }
    .num2  { font-size: 15px; font-weight: 700; }
    .code  { font-size: 13px; fill: #E6EDF7; }
    .leg   { font-size: 14px; fill: #9FB0C8; }
    .lab   { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; }
    .small { font-size: 13px; fill: #6F83A3; }
    .badge { font-size: 12px; font-weight: 600; fill: #39C5CF; }
    .stgv  { font-size: 14px; font-weight: 600; fill: #BC8CFF; }
    .big   { font-size: 26px; font-weight: 700; fill: #F0F6FC; } .rl { font-size: 17px; font-weight: 400; fill: #8B949E; }
    .sealt { font-size: 15px; font-weight: 600; fill: #3FB950; }

    /* 12s: pergunta, plano e SQL no servidor; um pacote cruza a fronteira; o Python roda no navegador; o selo fecha. */
    .anim { animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .c1 { animation-name: c1; } .c2 { animation-name: c2; } .c3 { animation-name: c3; } .c4 { animation-name: c4; }
    .res { animation-name: res; } .seal { animation-name: seal; } .foot { animation-name: foot; }
    .pkt { animation-name: pkt; } .pill { animation-name: pill; } .bhi { animation-name: bhi; }
    @keyframes c1 { 0%, 2% { opacity: 0; transform: translateY(8px); } 6%, 94% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
    @keyframes c2 { 0%, 8% { opacity: 0; transform: translateY(8px); } 12%, 94% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
    @keyframes c3 { 0%, 14% { opacity: 0; transform: translateY(8px); } 18%, 94% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
    @keyframes c4 { 0%, 42% { opacity: 0; transform: translateY(8px); } 46%, 94% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
    @keyframes dot0 { 0%, 56.0% { opacity: 0; } 58.0%, 94% { opacity: 1; } 100% { opacity: 0; } } .d0 { animation-name: dot0; } @keyframes dot1 { 0%, 56.9% { opacity: 0; } 58.9%, 94% { opacity: 1; } 100% { opacity: 0; } } .d1 { animation-name: dot1; } @keyframes dot2 { 0%, 57.8% { opacity: 0; } 59.8%, 94% { opacity: 1; } 100% { opacity: 0; } } .d2 { animation-name: dot2; } @keyframes dot3 { 0%, 58.7% { opacity: 0; } 60.7%, 94% { opacity: 1; } 100% { opacity: 0; } } .d3 { animation-name: dot3; } @keyframes dot4 { 0%, 59.6% { opacity: 0; } 61.6%, 94% { opacity: 1; } 100% { opacity: 0; } } .d4 { animation-name: dot4; } @keyframes dot5 { 0%, 60.5% { opacity: 0; } 62.5%, 94% { opacity: 1; } 100% { opacity: 0; } } .d5 { animation-name: dot5; } @keyframes dot6 { 0%, 61.4% { opacity: 0; } 63.4%, 94% { opacity: 1; } 100% { opacity: 0; } } .d6 { animation-name: dot6; } @keyframes dot7 { 0%, 62.3% { opacity: 0; } 64.3%, 94% { opacity: 1; } 100% { opacity: 0; } } .d7 { animation-name: dot7; } @keyframes dot8 { 0%, 63.2% { opacity: 0; } 65.2%, 94% { opacity: 1; } 100% { opacity: 0; } } .d8 { animation-name: dot8; } @keyframes dot9 { 0%, 64.1% { opacity: 0; } 66.1%, 94% { opacity: 1; } 100% { opacity: 0; } } .d9 { animation-name: dot9; } @keyframes dot10 { 0%, 65.0% { opacity: 0; } 67.0%, 94% { opacity: 1; } 100% { opacity: 0; } } .d10 { animation-name: dot10; } @keyframes dot11 { 0%, 65.9% { opacity: 0; } 67.9%, 94% { opacity: 1; } 100% { opacity: 0; } } .d11 { animation-name: dot11; }
    .trend { animation-name: trend; } .ans { animation-name: foot; }
    @keyframes trend { 0%, 66% { opacity: 0; } 70%, 94% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes res  { 0%, 56% { opacity: 0; } 60%, 94% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes seal { 0%, 70% { opacity: 0; transform: translateY(8px); } 74%, 94% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
    @keyframes foot { 0%, 76% { opacity: 0; } 80%, 94% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes pkt  { 0%, 22% { opacity: 0; transform: translateY(0); } 24% { opacity: 1; transform: translateY(0); } 38% { opacity: 1; transform: translateY(230px); } 50% { opacity: 1; transform: translateY(230px); } 54%, 100% { opacity: 0; transform: translateY(230px); } }
    @keyframes pill { 0%, 26% { opacity: 0; } 30%, 40% { opacity: 1; } 44%, 100% { opacity: 0; } }
    @keyframes bhi  { 0%, 36% { opacity: 0; } 40%, 46% { opacity: 1; } 54%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .anim { animation: none !important; } .moving { display: none; } }
  </style>
  <defs><filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4"/></filter></defs>

  <rect x="0.5" y="0.5" width="399" height="539" rx="20" fill="#0B1220" stroke="#1E2A40"/>
  <path d="M36 33 L46 43 L36 53 L26 43 Z" fill="#4C7DFF"/><text class="f brand" x="56" y="51">Analista de dados com IA</text>
  
  <text class="f lab" x="56" y="102" fill="#9FB0C8">NO SERVIDOR · O AGENTE PENSA</text><text class="f lab" x="56" y="292" fill="#39C5CF">NO SEU NAVEGADOR · O PYTHON RODA</text><text class="f stgv" x="376" y="262" text-anchor="end">fronteira</text>
  <line x1="24" y1="268" x2="376" y2="268" stroke="#A371F7" stroke-opacity=".6" stroke-width="2" stroke-dasharray="5 5"/>
  <g class="moving"><line x1="24" y1="268" x2="376" y2="268" class="anim bhi" stroke="#39C5CF" stroke-width="2.5" opacity="0"/></g>
  <line x1="30" y1="124" x2="30" y2="354" stroke="#25324A" stroke-width="2"/>
  <g class="anim c1"><rect x="56" y="110" width="320" height="36" rx="10" fill="#131C2E" stroke="#4C7DFF" stroke-width="1.5"/><text class="f chip" x="72" y="133">O tempo de entrega afeta a nota?</text></g>
  <g class="anim c2"><rect x="56" y="150" width="320" height="36" rx="10" fill="#131C2E" stroke="#25324A" stroke-width="1.5"/><text class="f num" x="72" y="173">Plano</text><text class="f leg" x="128" y="173">cruzar tempo e nota</text></g>
  <g class="anim c3"><rect x="56" y="190" width="320" height="58" rx="10" fill="#131C2E" stroke="#25324A" stroke-width="1.5"/><text class="m code" x="72" y="213"><tspan fill="#58A6FF">SELECT</tspan> tempo_entrega_min,</text><text class="m code" x="72" y="233">&#160;&#160;avaliacao <tspan fill="#58A6FF">FROM</tspan> pedidos</text></g>
  <g class="anim c4"><rect x="56" y="302" width="320" height="130" rx="12" fill="#131C2E" stroke="#39C5CF" stroke-opacity=".7" stroke-width="1.5"/><rect x="236" y="312" width="130" height="22" rx="11" fill="#39C5CF" fill-opacity=".12" stroke="#39C5CF" stroke-opacity=".7"/><text class="f badge" x="301" y="327" text-anchor="middle">no seu navegador</text><text class="f num2" x="72" y="328" fill="#39C5CF">Python</text><text class="m code" x="72" y="352">r = <tspan fill="#39C5CF">teste_correlacao</tspan>(</text><text class="m code" x="72" y="370">&#160;&#160;df.tempo_entrega_min,</text><text class="m code" x="72" y="388">&#160;&#160;df.avaliacao)</text><g class="anim res"><text class="m big" x="72" y="418"><tspan class="rl">r = </tspan>-0,506</text></g><path d="M286 344V398H366" fill="none" stroke="#3A4A66" stroke-width="1.5"/><circle class="anim dot d0" cx="293" cy="354" r="3.5" fill="#F0883E" fill-opacity=".9"/><circle class="anim dot d1" cx="299" cy="362" r="3.5" fill="#F0883E" fill-opacity=".9"/><circle class="anim dot d2" cx="305" cy="353" r="3.5" fill="#F0883E" fill-opacity=".9"/><circle class="anim dot d3" cx="311" cy="364" r="3.5" fill="#F0883E" fill-opacity=".9"/><circle class="anim dot d4" cx="317" cy="359" r="3.5" fill="#F0883E" fill-opacity=".9"/><circle class="anim dot d5" cx="324" cy="370" r="3.5" fill="#F0883E" fill-opacity=".9"/><circle class="anim dot d6" cx="330" cy="363" r="3.5" fill="#F0883E" fill-opacity=".9"/><circle class="anim dot d7" cx="337" cy="374" r="3.5" fill="#F0883E" fill-opacity=".9"/><circle class="anim dot d8" cx="342" cy="369" r="3.5" fill="#F0883E" fill-opacity=".9"/><circle class="anim dot d9" cx="348" cy="379" r="3.5" fill="#F0883E" fill-opacity=".9"/><circle class="anim dot d10" cx="354" cy="375" r="3.5" fill="#F0883E" fill-opacity=".9"/><circle class="anim dot d11" cx="358" cy="386" r="3.5" fill="#F0883E" fill-opacity=".9"/><path class="anim trend" d="M292 353L362 384" stroke="#FFA657" stroke-width="2.5" stroke-linecap="round" fill="none"/></g>
  <g class="moving"><g class="anim pkt"><circle cx="30" cy="124" r="7" fill="#39C5CF" opacity=".6" filter="url(#glow)"/><circle cx="30" cy="124" r="4.5" fill="#F0F6FC"/></g></g>
  
  <g class="anim seal"><rect x="56" y="442" width="214" height="40" rx="20" fill="#3FB950" fill-opacity=".12" stroke="#3FB950" stroke-opacity=".6"/><circle cx="78" cy="462" r="11" fill="#3FB950"/><path d="M72.5 462.5l3.8 3.8 7.2-7.6" fill="none" stroke="#0B1220" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text class="f sealt" x="97" y="467.5">números conferidos</text></g>
  <text class="anim ans f" x="56" y="506" font-size="15" fill="#F0F6FC"><tspan font-weight="700">Sim:</tspan> quanto maior o tempo, menor a nota.</text>
  <text class="anim foot f small" x="56" y="527">cerca de 14 s · R$ 0</text>
</svg>
