<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" role="img" aria-labelledby="t d">
  <title id="t">A ferramenta é consequência do problema</title>
  <desc id="d">Três clusters de ferramentas: Dados e BI, Engenharia, e IA aplicada. O problema decide por qual deles o trabalho passa.</desc>
  <style>
    .f { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .ttl { font-size: 16px; font-weight: 700; }
    .chip { font-size: 13px; font-weight: 500; fill: #C9D1D9; }
    .hint { font-size: 13px; fill: #8B949E; }

    .anim { animation-duration: 15s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(.4,0,.2,1); }
    .sig { animation-name: sig; animation-timing-function: linear; }
    .ca { animation-name: ca; } .cb { animation-name: cb; } .cc { animation-name: cc; }
    @keyframes sig {
      0% { transform: translateY(0); opacity: 0; } 4% { opacity: 1; }
      12% { transform: translateY(0); } 28% { transform: translateY(0); }
      36% { transform: translateY(156px); } 52% { transform: translateY(156px); }
      60% { transform: translateY(312px); } 76% { transform: translateY(312px); opacity: 1; }
      80%, 100% { transform: translateY(312px); opacity: 0; }
    }
    @keyframes ca { 0%, 10% { opacity: .5; } 14%, 29% { opacity: 1; } 33%, 100% { opacity: .5; } }
    @keyframes cb { 0%, 34% { opacity: .5; } 38%, 53% { opacity: 1; } 57%, 100% { opacity: .5; } }
    @keyframes cc { 0%, 58% { opacity: .5; } 62%, 77% { opacity: 1; } 81%, 100% { opacity: .5; } }
    @media (prefers-reduced-motion: reduce) { .anim { animation: none !important; } .moving { display: none; } }
  </style>
  <defs><filter id="s7m" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4"/></filter></defs>

  <rect x="0.5" y="0.5" width="399" height="519" rx="16" fill="#0D1117" stroke="#21262D"/>
  <text class="f hint" x="34" y="26">o problema escolhe o cluster</text>

  <g class="anim ca">
    <rect x="34" y="40" width="342" height="140" rx="14" fill="#161B22" stroke="#21262D"/>
    <text class="f ttl" x="54" y="74" fill="#39C5CF">Dados &amp; BI</text>
    <g fill="#0D1117" stroke="#30363D">
      <rect x="54" y="92" width="56" height="28" rx="8"/><rect x="118" y="92" width="86" height="28" rx="8"/>
      <rect x="212" y="92" width="74" height="28" rx="8"/>
      <rect x="54" y="130" width="78" height="28" rx="8"/><rect x="140" y="130" width="82" height="28" rx="8"/>
    </g>
    <g class="f chip" text-anchor="middle">
      <text x="82" y="111">SQL</text><text x="161" y="111">Power BI</text><text x="249" y="111">Python</text>
      <text x="93" y="149">pandas</text><text x="181" y="149">DuckDB</text>
    </g>
  </g>

  <g class="anim cb">
    <rect x="34" y="196" width="342" height="140" rx="14" fill="#161B22" stroke="#21262D"/>
    <text class="f ttl" x="54" y="230" fill="#58A6FF">Engenharia</text>
    <g fill="#0D1117" stroke="#30363D">
      <rect x="54" y="248" width="92" height="28" rx="8"/><rect x="154" y="248" width="62" height="28" rx="8"/>
      <rect x="224" y="248" width="72" height="28" rx="8"/>
      <rect x="54" y="286" width="98" height="28" rx="8"/><rect x="160" y="286" width="86" height="28" rx="8"/>
    </g>
    <g class="f chip" text-anchor="middle">
      <text x="100" y="267">TypeScript</text><text x="185" y="267">React</text><text x="260" y="267">Next.js</text>
      <text x="103" y="305">PostgreSQL</text><text x="203" y="305">Supabase</text>
    </g>
  </g>

  <g class="anim cc">
    <rect x="34" y="352" width="342" height="140" rx="14" fill="#161B22" stroke="#21262D"/>
    <text class="f ttl" x="54" y="386" fill="#BC8CFF">IA aplicada</text>
    <g fill="#0D1117" stroke="#30363D">
      <rect x="54" y="404" width="60" height="28" rx="8"/><rect x="122" y="404" width="116" height="28" rx="8"/>
      <rect x="54" y="442" width="88" height="28" rx="8"/><rect x="150" y="442" width="138" height="28" rx="8"/>
    </g>
    <g class="f chip" text-anchor="middle">
      <text x="84" y="423">LLMs</text><text x="180" y="423">Anthropic SDK</text>
      <text x="98" y="461">workflows</text><text x="219" y="461">validação de saída</text>
    </g>
  </g>

  <g class="moving">
    <g class="anim sig">
      <circle cx="18" cy="110" r="6" fill="#58A6FF" filter="url(#s7m)" opacity=".8"/>
      <circle cx="18" cy="110" r="4" fill="#F0F6FC"/>
    </g>
  </g>
</svg>
