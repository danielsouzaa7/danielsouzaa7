<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560" role="img" aria-labelledby="t d">
  <title id="t">Como eu construo</title>
  <desc id="d">Problema, operação, dados, regras, arquitetura, implementação, validação e produto, em sequência. A partir dos dados saem dois ramos opcionais — BI e Analytics, IA e automação — e os dois voltam para a validação.</desc>
  <style>
    .f { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .lbl { font-size: 17px; font-weight: 600; fill: #C9D1D9; }
    .bi  { font-size: 15px; font-weight: 600; fill: #39C5CF; }
    .ia  { font-size: 15px; font-weight: 600; fill: #BC8CFF; }

    .anim { animation-duration: 13s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .main { animation-name: main; } .br { animation-name: br; }
    .s1 { animation-name: s1; } .s2 { animation-name: s2; } .s3 { animation-name: s3; } .s4 { animation-name: s4; }
    .s5 { animation-name: s5; } .s6 { animation-name: s6; } .s7 { animation-name: s7; } .s8 { animation-name: s8; }
    .kbi { animation-name: kbi; } .kia { animation-name: kia; }

    /* espinha vertical: 60, 120, 180, 240, 300, 360, 420, 480 */
    @keyframes main {
      0% { transform: translateY(0); opacity: 0; } 2% { opacity: 1; }
      10% { transform: translateY(60px); } 20% { transform: translateY(120px); } 30% { transform: translateY(180px); }
      40% { transform: translateY(240px); } 50% { transform: translateY(300px); } 60% { transform: translateY(360px); }
      70% { transform: translateY(420px); opacity: 1; } 76%, 100% { transform: translateY(420px); opacity: 0; }
    }
    /* o ramo sai dos dados, percorre a coluna auxiliar e volta para a validação */
    @keyframes br {
      0%, 29.9% { transform: translate(0,0); opacity: 0; } 30% { transform: translate(0,0); opacity: 1; }
      36% { transform: translate(306px, 15px); } 56% { transform: translate(306px, 225px); }
      62% { transform: translate(0, 240px); opacity: 1; } 64%, 100% { transform: translate(0, 240px); opacity: 0; }
    }
    @keyframes s1 { 0%, 1%  { opacity: .28; } 3%, 92%  { opacity: 1; } 100% { opacity: .28; } }
    @keyframes s2 { 0%, 9%  { opacity: .28; } 11%, 92% { opacity: 1; } 100% { opacity: .28; } }
    @keyframes s3 { 0%, 19% { opacity: .28; } 21%, 92% { opacity: 1; } 100% { opacity: .28; } }
    @keyframes s4 { 0%, 29% { opacity: .28; } 31%, 92% { opacity: 1; } 100% { opacity: .28; } }
    @keyframes s5 { 0%, 39% { opacity: .28; } 41%, 92% { opacity: 1; } 100% { opacity: .28; } }
    @keyframes s6 { 0%, 49% { opacity: .28; } 51%, 92% { opacity: 1; } 100% { opacity: .28; } }
    @keyframes s7 { 0%, 59% { opacity: .28; } 61%, 92% { opacity: 1; } 100% { opacity: .28; } }
    @keyframes s8 { 0%, 69% { opacity: .28; } 71%, 92% { opacity: 1; } 100% { opacity: .28; } }
    @keyframes kbi { 0%, 39% { opacity: .28; } 41%, 92% { opacity: 1; } 100% { opacity: .28; } }
    @keyframes kia { 0%, 47% { opacity: .28; } 49%, 92% { opacity: 1; } 100% { opacity: .28; } }

    @media (prefers-reduced-motion: reduce) { .anim { animation: none !important; } .moving { display: none; } }
  </style>
  <defs><filter id="s4m" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4"/></filter></defs>

  <rect x="0.5" y="0.5" width="399" height="559" rx="16" fill="#0D1117" stroke="#21262D"/>

  <line x1="46" y1="60" x2="46" y2="480" stroke="#30363D" stroke-width="2"/>
  <path d="M46 180 V195 H352 V405 H46 V420" fill="none" stroke="#A371F7" stroke-opacity=".4" stroke-width="2" stroke-dasharray="6 6"/>

  <circle class="anim s1" cx="46" cy="60"  r="9" fill="#8B949E"/>
  <circle class="anim s2" cx="46" cy="120" r="9" fill="#39C5CF"/>
  <circle class="anim s3" cx="46" cy="180" r="10" fill="#39C5CF"/>
  <circle class="anim s4" cx="46" cy="240" r="9" fill="#58A6FF"/>
  <circle class="anim s5" cx="46" cy="300" r="9" fill="#58A6FF"/>
  <circle class="anim s6" cx="46" cy="360" r="9" fill="#58A6FF"/>
  <circle class="anim s7" cx="46" cy="420" r="10" fill="#3FB950"/>
  <circle class="anim s8" cx="46" cy="480" r="9" fill="#F0F6FC"/>

  <g class="f lbl">
    <text x="70" y="66">problema</text>
    <text x="70" y="126">operação</text>
    <text x="70" y="186">dados</text>
    <text x="70" y="246">regras</text>
    <text x="70" y="306">arquitetura</text>
    <text x="70" y="366">implementação</text>
    <text x="70" y="426">validação</text>
    <text x="70" y="486">produto</text>
  </g>

  <circle class="anim kbi" cx="352" cy="240" r="8" fill="#39C5CF"/>
  <circle class="anim kia" cx="352" cy="330" r="8" fill="#A371F7"/>
  <text class="anim kbi f bi" x="336" y="246" text-anchor="end">BI · Analytics</text>
  <text class="anim kia f ia" x="336" y="336" text-anchor="end">IA · Automação</text>

  <text class="f bi" x="376" y="530" text-anchor="end">os dois ramos voltam para a validação</text>

  <g class="moving">
    <g class="anim main"><circle cx="46" cy="60" r="6" fill="#58A6FF" filter="url(#s4m)" opacity=".75"/><circle cx="46" cy="60" r="4" fill="#F0F6FC"/></g>
    <g class="anim br"><circle cx="46" cy="180" r="5" fill="#A371F7" filter="url(#s4m)" opacity=".75"/><circle cx="46" cy="180" r="3.5" fill="#E2C5FF"/></g>
  </g>
</svg>
