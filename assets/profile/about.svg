<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-labelledby="t d">
  <title id="t">Da operação real à decisão</title>
  <desc id="d">Sinais soltos da operação se organizam em dados, ganham contexto e viram uma decisão — que então pede dashboard, automação ou sistema.</desc>
  <style>
    .f { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .lbl { font-size: 19px; font-weight: 600; }
    .out { font-size: 17px; font-weight: 600; fill: #C9D1D9; }
    .cy { fill: #39C5CF; } .bl { fill: #58A6FF; } .gr { fill: #3FB950; }

    /* 14s: sinal bruto vira ordem, e só então decisão. */
    .anim { animation-duration: 14s; animation-iteration-count: infinite; animation-timing-function: cubic-bezier(.4,0,.2,1); }
    .lin { animation-timing-function: linear; }
    .d1 { animation-name: d1; } .d2 { animation-name: d2; } .d3 { animation-name: d3; } .d4 { animation-name: d4; }
    .d5 { animation-name: d5; } .d6 { animation-name: d6; } .d7 { animation-name: d7; } .d8 { animation-name: d8; }
    .pc { animation-name: pc; } .pd { animation-name: pd; }
    .nc { animation-name: nc; } .nd { animation-name: nd; }
    .b1 { animation-name: b1; } .b2 { animation-name: b2; } .b3 { animation-name: b3; }

    @keyframes d1 { 0%, 6% { transform: translate(16px, 30px); } 26%, 92% { transform: translate(0,0); } 100% { transform: translate(16px, 30px); } }
    @keyframes d2 { 0%, 6% { transform: translate(-20px, 11px); } 28%, 92% { transform: translate(0,0); } 100% { transform: translate(-20px, 11px); } }
    @keyframes d3 { 0%, 6% { transform: translate(24px, -16px); } 30%, 92% { transform: translate(0,0); } 100% { transform: translate(24px, -16px); } }
    @keyframes d4 { 0%, 6% { transform: translate(-13px, -27px); } 32%, 92% { transform: translate(0,0); } 100% { transform: translate(-13px, -27px); } }
    @keyframes d5 { 0%, 6% { transform: translate(27px, 18px); } 27%, 92% { transform: translate(0,0); } 100% { transform: translate(27px, 18px); } }
    @keyframes d6 { 0%, 6% { transform: translate(-25px, -7px); } 29%, 92% { transform: translate(0,0); } 100% { transform: translate(-25px, -7px); } }
    @keyframes d7 { 0%, 6% { transform: translate(11px, -32px); } 31%, 92% { transform: translate(0,0); } 100% { transform: translate(11px, -32px); } }
    @keyframes d8 { 0%, 6% { transform: translate(-27px, 25px); } 33%, 92% { transform: translate(0,0); } 100% { transform: translate(-27px, 25px); } }

    @keyframes pc { 0%, 36% { transform: translateX(0); opacity: 0; } 38% { opacity: 1; } 48% { transform: translateX(128px); opacity: 1; } 49%, 100% { transform: translateX(128px); opacity: 0; } }
    @keyframes pd { 0%, 52% { transform: translateX(0); opacity: 0; } 54% { opacity: 1; } 64% { transform: translateX(120px); opacity: 1; } 65%, 100% { transform: translateX(120px); opacity: 0; } }
    @keyframes nc { 0%, 47.9% { opacity: .25; } 50%, 92% { opacity: 1; } 100% { opacity: .25; } }
    @keyframes nd { 0%, 63.9% { opacity: .25; } 66%, 92% { opacity: 1; } 100% { opacity: .25; } }
    @keyframes b1 { 0%, 69.9% { opacity: .35; } 72%, 92% { opacity: 1; } 100% { opacity: .35; } }
    @keyframes b2 { 0%, 72.9% { opacity: .35; } 75%, 92% { opacity: 1; } 100% { opacity: .35; } }
    @keyframes b3 { 0%, 75.9% { opacity: .35; } 78%, 92% { opacity: 1; } 100% { opacity: .35; } }

    @media (prefers-reduced-motion: reduce) { .anim { animation: none !important; } .moving { display: none; } }
  </style>
  <defs><filter id="s2" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4"/></filter></defs>

  <rect x="0.5" y="0.5" width="759" height="259" rx="18" fill="#0D1117" stroke="#21262D"/>

  <!-- operação: ruído que assume forma -->
  <g fill="#39C5CF">
    <circle class="anim d1" cx="60"  cy="110" r="5"/><circle class="anim d2" cx="105" cy="110" r="5"/>
    <circle class="anim d3" cx="150" cy="110" r="5"/><circle class="anim d4" cx="195" cy="110" r="5"/>
    <circle class="anim d5" cx="60"  cy="155" r="5"/><circle class="anim d6" cx="105" cy="155" r="5"/>
    <circle class="anim d7" cx="150" cy="155" r="5"/><circle class="anim d8" cx="195" cy="155" r="5"/>
  </g>
  <text class="f lbl cy" x="128" y="205" text-anchor="middle">operação → dados</text>

  <g stroke="#30363D" stroke-width="2"><path d="M232 133 L378 133"/><path d="M402 133 L498 133"/></g>

  <circle class="anim nc" cx="390" cy="133" r="12" fill="#58A6FF"/>
  <circle class="anim nd" cx="510" cy="133" r="12" fill="#3FB950"/>
  <text class="f lbl bl" x="390" y="98" text-anchor="middle">contexto</text>
  <text class="f lbl gr" x="510" y="98" text-anchor="middle">decisão</text>

  <!-- o que a decisão exige -->
  <g stroke="#30363D" stroke-width="2">
    <path d="M522 133 L572 92"/><path d="M522 133 L572 133"/><path d="M522 133 L572 174"/>
  </g>
  <g class="f out">
    <text class="anim b1" x="584" y="98">dashboard</text>
    <text class="anim b2" x="584" y="139">automação</text>
    <text class="anim b3" x="584" y="180">sistema</text>
  </g>

  <g class="moving">
    <g class="anim lin pc"><circle cx="232" cy="133" r="5" fill="#58A6FF" filter="url(#s2)" opacity=".8"/><circle cx="232" cy="133" r="3.5" fill="#EAF2FF"/></g>
    <g class="anim lin pd"><circle cx="402" cy="133" r="5" fill="#3FB950" filter="url(#s2)" opacity=".8"/><circle cx="402" cy="133" r="3.5" fill="#EAFBEF"/></g>
  </g>
</svg>
