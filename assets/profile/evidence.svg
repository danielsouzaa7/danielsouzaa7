<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 490" width="760" height="490" role="img" aria-labelledby="t d">
  <title id="t">Engenharia que eu consigo provar</title>
  <desc id="d">Analista de dados com IA: 713 testes passando no CI público e 97% de cobertura; avaliação contra o modelo real com média 7,0 de 8 em 5 rodadas, meta 8 de 8 não batida; 10 vetores de fuga bloqueados em 3 navegadores; 5 rodadas de red team. Pulse: 656 testes, 655 passam e 1 é pulado, documentado. Event Operations OS: 1.137 de 1.137 unitários, 649 de 649 verificações de migrations, 50 de 50 de integração, 25 de 25 de aceitação e concorrência aprovada.</desc>
  <style>
    .f { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .ttl { font-size: 19px; font-weight: 700; fill: #F0F6FC; }
    .row { font-size: 16px; fill: #C9D1D9; }
    .dim { font-size: 14px; fill: #8B949E; }

    /* 18s: a verificação passa devagar, uma placa de cada vez. */
    .anim { animation-duration: 18s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .scanN { animation-name: scanN; } .scanA { animation-name: scanA; } .scanB { animation-name: scanB; }
    .okN { animation-name: okN; } .okA { animation-name: okA; } .okB { animation-name: okB; }

    @keyframes scanN { 0%, 0% { transform: translateY(0); opacity: 0; } 3% { opacity: .9; } 22% { transform: translateY(140px); opacity: .9; } 26%, 100% { transform: translateY(140px); opacity: 0; } }
    @keyframes scanA { 0%, 33% { transform: translateY(0); opacity: 0; } 36% { opacity: .9; } 55% { transform: translateY(196px); opacity: .9; } 59%, 100% { transform: translateY(196px); opacity: 0; } }
    @keyframes scanB { 0%, 66% { transform: translateY(0); opacity: 0; } 69% { opacity: .9; } 88% { transform: translateY(196px); opacity: .9; } 92%, 100% { transform: translateY(196px); opacity: 0; } }
    @keyframes okN { 0%, 23% { stroke-dashoffset: 30; opacity: 0; } 25% { opacity: 1; } 30%, 94% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 30; opacity: 0; } }
    @keyframes okA { 0%, 56% { stroke-dashoffset: 30; opacity: 0; } 58% { opacity: 1; } 63%, 94% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 30; opacity: 0; } }
    @keyframes okB { 0%, 89% { stroke-dashoffset: 30; opacity: 0; } 91% { opacity: 1; } 96%, 94% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 30; opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .anim { animation: none !important; } .moving { display: none; } }
  </style>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3FB950" stop-opacity="0"/>
      <stop offset=".5" stop-color="#3FB950" stop-opacity=".85"/>
      <stop offset="1" stop-color="#3FB950" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardN"><rect x="30" y="40" width="700" height="170" rx="16"/></clipPath>
    <clipPath id="cardA"><rect x="30" y="40" width="330" height="230" rx="16"/></clipPath>
    <clipPath id="cardB"><rect x="400" y="40" width="330" height="230" rx="16"/></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="489" rx="18" fill="#0D1117" stroke="#21262D"/>

  <!-- Analista de dados com IA -->
  <rect x="30" y="40" width="700" height="170" rx="16" fill="#161B22" stroke="#21262D"/>
  <text class="f ttl" x="56" y="80">Analista de dados com IA</text>
  <rect x="610" y="60" width="96" height="26" rx="13" fill="none" stroke="#3FB950"/>
  <text class="f dim" x="658" y="78" text-anchor="middle" style="fill:#3FB950">CI público</text>
  <g class="f row">
    <text x="56" y="120">713 testes passando no CI</text>
    <text x="56" y="148">97% de cobertura</text>
    <text x="396" y="120">avaliação real: média 7,0/8</text>
    <text x="396" y="148">10 fugas bloqueadas, 3 navegadores</text>
  </g>
  <text class="f dim" x="56" y="190">5 rodadas de avaliação e 5 de red team; meta 8/8 não batida</text>
  <g clip-path="url(#cardN)" class="moving">
    <rect class="anim scanN" x="30" y="44" width="700" height="26" fill="url(#beam)" opacity="0"/>
  </g>
  <path class="anim okN" d="M684 176 l9 9 l17 -19" fill="none" stroke="#3FB950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="30" opacity="0"/>


  <g transform="translate(0,190)">
  <!-- Pulse -->
  <rect x="30" y="40" width="330" height="230" rx="16" fill="#161B22" stroke="#21262D"/>
  <text class="f ttl" x="56" y="80">Pulse</text>
  <g class="f row">
    <text x="56" y="124">656 testes</text>
    <text x="56" y="156">655 passam</text>
    <text x="56" y="188">1 pulado, documentado</text>
  </g>
  <text class="f dim" x="56" y="232">dados 100% sintéticos</text>
  <g clip-path="url(#cardA)" class="moving">
    <rect class="anim scanA" x="30" y="44" width="330" height="26" fill="url(#beam)" opacity="0"/>
  </g>
  <path class="anim okA" d="M314 236 l9 9 l17 -19" fill="none" stroke="#3FB950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="30" opacity="0"/>

  <!-- Event Operations OS -->
  <rect x="400" y="40" width="330" height="230" rx="16" fill="#161B22" stroke="#21262D"/>
  <text class="f ttl" x="426" y="80">Event Operations OS</text>
  <g class="f row">
    <text x="426" y="118">1.137 / 1.137 unitários</text>
    <text x="426" y="146">649 / 649 migrations</text>
    <text x="426" y="174">50 / 50 integração</text>
    <text x="426" y="202">25 / 25 aceitação</text>
  </g>
  <text class="f dim" x="426" y="232">concorrência: aprovado</text>
  <g clip-path="url(#cardB)" class="moving">
    <rect class="anim scanB" x="400" y="44" width="330" height="26" fill="url(#beam)" opacity="0"/>
  </g>
  <path class="anim okB" d="M684 236 l9 9 l17 -19" fill="none" stroke="#3FB950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="30" opacity="0"/>
  </g>
</svg>
