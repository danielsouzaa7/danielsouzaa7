<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d">
  <title id="t">Engenharia que eu consigo provar</title>
  <desc id="d">Pulse: 656 testes, 655 passam e 1 é pulado, documentado. Event Operations OS: 1.137 de 1.137 unitários, 649 de 649 verificações de migrations, 50 de 50 de integração, 25 de 25 de aceitação e concorrência aprovada.</desc>
  <style>
    .f { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .ttl { font-size: 19px; font-weight: 700; fill: #F0F6FC; }
    .row { font-size: 16px; fill: #C9D1D9; }
    .dim { font-size: 14px; fill: #8B949E; }

    /* 18s: a verificação passa devagar, uma placa de cada vez. */
    .anim { animation-duration: 18s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .scanA { animation-name: scanA; } .scanB { animation-name: scanB; }
    .okA { animation-name: okA; } .okB { animation-name: okB; }

    @keyframes scanA { 0% { transform: translateY(0); opacity: 0; } 3% { opacity: .9; } 26% { transform: translateY(196px); opacity: .9; } 30%, 100% { transform: translateY(196px); opacity: 0; } }
    @keyframes scanB { 0%, 34% { transform: translateY(0); opacity: 0; } 37% { opacity: .9; } 60% { transform: translateY(196px); opacity: .9; } 64%, 100% { transform: translateY(196px); opacity: 0; } }
    @keyframes okA { 0%, 27% { stroke-dashoffset: 30; opacity: 0; } 29% { opacity: 1; } 34%, 94% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 30; opacity: 0; } }
    @keyframes okB { 0%, 61% { stroke-dashoffset: 30; opacity: 0; } 63% { opacity: 1; } 68%, 94% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 30; opacity: 0; } }

    @media (prefers-reduced-motion: reduce) { .anim { animation: none !important; } .moving { display: none; } }
  </style>
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3FB950" stop-opacity="0"/>
      <stop offset=".5" stop-color="#3FB950" stop-opacity=".85"/>
      <stop offset="1" stop-color="#3FB950" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardA"><rect x="30" y="40" width="330" height="230" rx="16"/></clipPath>
    <clipPath id="cardB"><rect x="400" y="40" width="330" height="230" rx="16"/></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="299" rx="18" fill="#0D1117" stroke="#21262D"/>

  <!-- Pulse -->
  <rect x="30" y="40" width="330" height="230" rx="16" fill="#161B22" stroke="#21262D"/>
  <text class="f ttl" x="56" y="80">Pulse</text>
  <g class="f row">
    <text x="56" y="124">656 testes</text>
    <text x="56" y="156">655 passam</text>
    <text x="56" y="188">1 pulado, documentado</text>
  </g>
  <text class="f dim" x="56" y="232">dados 100% sintéticos</text>
  <g clip-path="url(#cardA)" class="moving">
    <rect class="anim scanA" x="30" y="44" width="330" height="26" fill="url(#beam)" opacity="0"/>
  </g>
  <path class="anim okA" d="M314 236 l9 9 l17 -19" fill="none" stroke="#3FB950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="30" opacity="0"/>

  <!-- Event Operations OS -->
  <rect x="400" y="40" width="330" height="230" rx="16" fill="#161B22" stroke="#21262D"/>
  <text class="f ttl" x="426" y="80">Event Operations OS</text>
  <g class="f row">
    <text x="426" y="118">1.137 / 1.137 unitários</text>
    <text x="426" y="146">649 / 649 migrations</text>
    <text x="426" y="174">50 / 50 integração</text>
    <text x="426" y="202">25 / 25 aceitação</text>
  </g>
  <text class="f dim" x="426" y="232">concorrência: aprovado</text>
  <g clip-path="url(#cardB)" class="moving">
    <rect class="anim scanB" x="400" y="44" width="330" height="26" fill="url(#beam)" opacity="0"/>
  </g>
  <path class="anim okB" d="M684 236 l9 9 l17 -19" fill="none" stroke="#3FB950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="30" opacity="0"/>
</svg>
