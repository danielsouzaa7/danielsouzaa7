<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-labelledby="t d">
  <title id="t">Daniel Souza — Software · Product · AI Engineering</title>
  <desc id="d">Uma informação percorre três portões em sequência: afirmado, verificado e decidido. Ela só avança de estado quando passa por cada portão.</desc>
  <style>
    .f { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .name { font-size: 54px; font-weight: 700; fill: #F0F6FC; letter-spacing: -1.4px; }
    .axes { font-size: 24px; font-weight: 500; fill: #8B949E; letter-spacing: .2px; }
    .lbl { font-size: 23px; font-weight: 600; }
    .a { fill: #D29922; } .v { fill: #3FB950; } .d { fill: #F0F6FC; }

    /* Estado final completo = versão estática (reduced motion). A animação só conta a ordem. */
    .anim { animation-duration: 9s; animation-iteration-count: infinite; animation-timing-function: linear; }
    .ping { transform-box: fill-box; transform-origin: center; }

    .pulse  { animation-name: travel; }
    .pcolor { animation-name: tint; }
    .s0 { animation-name: s0; } .s1 { animation-name: s1; } .s2 { animation-name: s2; } .s3 { animation-name: s3; }
    .gA { animation-name: gA; } .gV { animation-name: gV; } .gD { animation-name: gD; }
    .pA { animation-name: pA; } .pV { animation-name: pV; } .pD { animation-name: pD; }

    @keyframes travel {
      0%   { transform: translateX(0);     opacity: 0; }
      3%   { opacity: 1; }
      18%  { transform: translateX(160px); }
      26%  { transform: translateX(160px); }
      42%  { transform: translateX(340px); }
      50%  { transform: translateX(340px); }
      66%  { transform: translateX(520px); }
      74%  { transform: translateX(520px); }
      88%  { transform: translateX(680px); opacity: 1; }
      92%, 100% { transform: translateX(680px); opacity: 0; }
    }
    @keyframes tint {
      0%, 17.9%  { fill: #8B949E; }
      18%, 41.9% { fill: #D29922; }
      42%, 65.9% { fill: #3FB950; }
      66%, 100%  { fill: #F0F6FC; }
    }
    /* trilho: cada trecho herda a cor do último portão atravessado */
    @keyframes s0 { 0%,3% { stroke-dashoffset: 160; } 18%,93% { stroke-dashoffset: 0; opacity: 1; } 100% { opacity: 0; } }
    @keyframes s1 { 0%,26% { stroke-dashoffset: 180; } 42%,93% { stroke-dashoffset: 0; opacity: 1; } 100% { opacity: 0; } }
    @keyframes s2 { 0%,50% { stroke-dashoffset: 180; } 66%,93% { stroke-dashoffset: 0; opacity: 1; } 100% { opacity: 0; } }
    @keyframes s3 { 0%,74% { stroke-dashoffset: 160; } 88%,93% { stroke-dashoffset: 0; opacity: 1; } 100% { opacity: 0; } }

    @keyframes gA { 0%,17.9% { opacity: 0; } 18%,93% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes gV { 0%,41.9% { opacity: 0; } 42%,93% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes gD { 0%,65.9% { opacity: 0; } 66%,93% { opacity: 1; } 100% { opacity: 0; } }

    @keyframes pA { 0%,17.9% { opacity: 0; transform: scale(1); } 18% { opacity: .9; transform: scale(1); } 26%,100% { opacity: 0; transform: scale(2.6); } }
    @keyframes pV { 0%,41.9% { opacity: 0; transform: scale(1); } 42% { opacity: .9; transform: scale(1); } 50%,100% { opacity: 0; transform: scale(2.6); } }
    @keyframes pD { 0%,65.9% { opacity: 0; transform: scale(1); } 66% { opacity: .9; transform: scale(1); } 74%,100% { opacity: 0; transform: scale(2.6); } }

    @media (prefers-reduced-motion: reduce) {
      .anim { animation: none !important; }
      .moving, .ring-ping { display: none; }
    }
  </style>

  <defs>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="299" rx="18" fill="#0D1117" stroke="#21262D"/>

  <g class="f">
    <text class="name" x="40" y="96">Daniel Souza</text>
    <text class="axes" x="42" y="136">Software · Product · AI Engineering</text>
  </g>

  <!-- trilho base -->
  <line x1="40" y1="212" x2="720" y2="212" stroke="#21262D" stroke-width="2"/>

  <!-- trilho percorrido, por estado -->
  <line class="anim s0" x1="40"  y1="212" x2="200" y2="212" stroke="#8B949E" stroke-opacity=".55" stroke-width="2" stroke-dasharray="160"/>
  <line class="anim s1" x1="200" y1="212" x2="380" y2="212" stroke="#D29922" stroke-width="2" stroke-dasharray="180"/>
  <line class="anim s2" x1="380" y1="212" x2="560" y2="212" stroke="#3FB950" stroke-width="2" stroke-dasharray="180"/>
  <line class="anim s3" x1="560" y1="212" x2="720" y2="212" stroke="#F0F6FC" stroke-opacity=".85" stroke-width="2" stroke-dasharray="160"/>

  <!-- portões: base apagada -->
  <g fill="#0D1117" stroke="#30363D" stroke-width="2">
    <circle cx="200" cy="212" r="11"/>
    <circle cx="380" cy="212" r="11"/>
    <circle cx="560" cy="212" r="11"/>
  </g>

  <!-- portões: estado aceso. afirmado é só contorno (alegação); verificado e decidido são cheios -->
  <circle class="anim gA" cx="200" cy="212" r="11" fill="#0D1117" stroke="#D29922" stroke-width="3"/>
  <circle class="anim gV" cx="380" cy="212" r="11" fill="#3FB950"/>
  <circle class="anim gD" cx="560" cy="212" r="11" fill="#F0F6FC"/>

  <g class="ring-ping" fill="none" stroke-width="2">
    <circle class="anim pA ping" cx="200" cy="212" r="11" stroke="#D29922"/>
    <circle class="anim pV ping" cx="380" cy="212" r="11" stroke="#3FB950"/>
    <circle class="anim pD ping" cx="560" cy="212" r="11" stroke="#F0F6FC"/>
  </g>

  <g class="f" text-anchor="middle">
    <text class="lbl a" x="200" y="258">afirmado</text>
    <text class="lbl v" x="380" y="258">verificado</text>
    <text class="lbl d" x="560" y="258">decidido</text>
  </g>

  <!-- a informação em trânsito -->
  <g class="moving">
    <g class="anim pulse">
      <circle class="anim pcolor" cx="40" cy="212" r="9" filter="url(#glow)" opacity=".7"/>
      <circle class="anim pcolor" cx="40" cy="212" r="5"/>
    </g>
  </g>
</svg>
